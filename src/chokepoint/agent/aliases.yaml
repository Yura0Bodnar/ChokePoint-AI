# aliases.yaml — entity → graph node_id resolution table.
#
# CO-OWNED with Person 1: every key must be a node id that exists in their
# seed graph. The four ids below are the shared placeholder vocabulary used
# identically across all foundation branches — do not rename them.
#
# Values are raw strings the LLM is likely to extract verbatim from an
# article. Matching is case-insensitive and punctuation-insensitive; a
# leading "the" / "Port of" is also tolerated, so "Hamburg" alone covers
# "Port of Hamburg" — the explicit variants are kept for readability.

