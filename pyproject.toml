[project]
name = "chokepoint"
version = "0.1.0"
description = "ChokePoint AI — Supply Chain Shock Simulator"
readme = "README.md"
authors = [
    { name = "Yurii Bodnar" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "json-repair>=0.30",
    "networkx>=3.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "selectolax>=0.3",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# Local CPU fallback (ARCHITECTURE_AND_PLAN.md §7.5 / P2.8). A dependency *group*,
# not an extra, so `uv sync --all-extras` (CI, Docker) never pulls torch.
# Install with: uv sync --group local
local = [
    "transformers>=4.45",
    "torch>=2.4",
    "accelerate>=1.0",
]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "types-networkx>=3.6.1.20260911",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The planning docs (ARCHITECTURE_AND_PLAN.md, PROMPT_*.md) contain
# illustrative, sometimes-abridged code snippets that are not meant to be
# literal, canonically-formatted modules — exclude markdown from lint/format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["chokepoint.contracts"]
strict = true

# The `local` dependency group (torch + transformers) is intentionally not installed in
# CI or the default dev env, so mypy cannot resolve them. They are imported lazily in
# agent/providers/local_hf.py only.
[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external API; excluded from CI (run with -m live)",
    "local: loads real model weights on CPU; excluded from CI (run with -m local)",
]
addopts = "-m 'not live and not local' --strict-markers"

# CPU-only torch wheels on Linux (the default PyPI wheel there bundles CUDA, ~2 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
